name: test-wheels.yaml

on:
  push:
    branches: [main]
    paths: ["tools/pypi/**", ".github/workflows/test-wheels.yaml"]
  pull_request:
    paths: ["tools/pypi/**", ".github/workflows/test-wheels.yaml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Test the wheel builder
        run: python3 -m unittest discover -s tools/pypi -v
