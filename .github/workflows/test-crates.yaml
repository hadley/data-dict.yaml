name: test-crates.yaml

on:
  push:
    branches: [main]
    paths-ignore:
      - 'r/**'
      - '.github/workflows/R-*.yaml'
  pull_request:
    paths-ignore:
      - 'r/**'
      - '.github/workflows/R-*.yaml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  # Linux ships as static musl only, so that is what Linux CI covers, on the
  # same runners dist releases from.
  musl:
    name: musl (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --workspace --all-targets --target ${{ matrix.target }}

      - name: Build the release binary
        run: cargo build -p data-dict-cli --features lsp --target ${{ matrix.target }}

      - name: Test
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Check the binary is fully static
        run: |
          bin=target/${{ matrix.target }}/debug/data-dict
          file "$bin"
          if readelf -d "$bin" | grep NEEDED; then
            echo "::error::$bin has dynamic library dependencies"
            exit 1
          fi
          if readelf -l "$bin" | grep INTERP; then
            echo "::error::$bin needs a dynamic loader"
            exit 1
          fi
