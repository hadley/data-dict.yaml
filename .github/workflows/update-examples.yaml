name: Update examples

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  update-examples:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build data-dict
        run: cargo build -p data-dict-cli --release

      - name: Sync examples
        run: Rscript examples.R sync

      # Examples that did validate are worth committing even when another
      # failed and turned the run red.
      - name: Commit if changed
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/examples/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            changed=$(git diff --cached --name-only | sed 's|site/examples/||;s|\.yaml||' | paste -sd ', ')
            git commit -m "Update examples: ${changed}"
            git push
          fi
