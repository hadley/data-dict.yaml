# Schema for data-dict.yaml documents (spec version 0.1.0).
#
# Written in the quarto-cli YAML schema dialect understood by the
# quarto-yaml-validation crate. See site/spec.md for the prose specification.
#
# Conventions in this schema:
#   - All objects are closed (`closed: true`): unknown keys are rejected.
#     This is appropriate while the spec is pre-1.0; bump the schema with the
#     spec when new fields are added.
#   - The column subschema is a single flat object. Type-specific rules
#     (e.g. `values` required for `type: enum`, `range` not valid on `string`)
#     are enforced by the validator (S07, S08) rather than structurally, to
#     avoid repeating the same object shape for each type.
#   - Cross-table / cross-field semantics (foreign-key targets really exist,
#     `join` expressions parse, `conflicts` columns appear in both sides) are
#     out of scope for the schema and belong in a separate validator.

object:
  closed: true
  properties:

    # Required, but its absence is checked by S18 (in validate_spec.rs) rather
    # than the schema, so the omission carries a patch suggesting `$version`.
    # A present-but-wrong value is still rejected here by the enum.
    "$version":
      enum: [0.1.0]
      description: >
        Version of the data-dict.yaml spec this document conforms to.

    # Optional in the schema (its absence is a warning, not an error — see
    # S09 in validate_spec.rs); a URL where readers can learn about the format.
    "$learn_more": string

    # Descriptive keys for the whole dataset. `name` is a terse identifier and
    # `label` a display title, both without uniqueness constraints; all are
    # optional.
    name: string
    label: string
    description: string
    details: string

    # A loose link (URL or dictionary-relative path) to the code that produced
    # the dataset. Unenforced: no S-check, never fetched or resolved.
    origin: string

    # A note of work that remains to be done. Accepted at every describing
    # level (dataset, table, column, field, relationship); each remaining
    # note is reported by S31.
    todo: string

    tables:
      arrayOf:
        object:
          closed: true
          required: [name, columns]
          properties:

            # `anyOf: [string, null]` lets an empty/null name through to the
            # semantic layer, where S11 reports it with a clear message; the
            # YAML parser collapses `""` to null. Uniqueness is S10's job.
            name:
              anyOf:
                - string
                - null
            label: string
            description: string
            details: string
            origin: string
            todo: string

            source:
              object:
                closed: true
                minProperties: 1
                properties:
                  parquet: string

            columns:
              arrayOf:
                object:
                  closed: true
                  required: [name]
                  properties:
                    # `anyOf: [string, null]` lets an empty/null name through
                    # to the semantic layer, where S11 reports it with a clear
                    # message; the YAML parser collapses `""` to null.
                    name:
                      anyOf:
                        - string
                        - null
                    label: string
                    description: string
                    details: string
                    todo: string
                    display:
                      enum: [restricted]
                    units: string
                    # Shape (S15) and placement (S14) are checked semantically
                    time_zone: string
                    # Valid types: the fixed scalars, "struct", and "list(element_type)"
                    # where element_type is any of the above. Semantic validation
                    # (S28) catches unknown strings; the schema accepts any string
                    # so that list(...) variants don't require enumeration here.
                    type: string
                    values:
                      anyOf:
                        - arrayOf:                  # [M, F, U]
                            anyOf:
                              - string
                              - number
                              - boolean
                        - object:                   # {M: Male, F: Female, ...}
                            additionalProperties: string
                    range:
                      arrayOf:
                        schema:
                          anyOf:
                            - number
                            - string
                        length: 2
                    constraints:
                      arrayOf:
                        anyOf:
                          # structural barewords
                          - enum: [primary_key, foreign_key, required, unique]
                          # assertions
                          - object:
                              closed: true
                              required: [assert]
                              properties:
                                assert: string
                                description: string
                    examples:
                      arrayOf: any
                    # Struct fields: reduced column descriptors, defined in
                    # schema-field.yaml (registered as `field`) so they can
                    # recurse. Type-specific rules (struct requires fields;
                    # fields banned on other types) stay semantic (S07).
                    fields:
                      arrayOf:
                        ref: field

            constraints:
              arrayOf:
                object:
                  closed: true
                  required: [assert]
                  properties:
                    assert: string
                    description: string

    relationships:
      arrayOf:
        object:
          closed: true
          required: [cardinality, join]
          properties:
            description: string
            todo: string
            cardinality:
              enum: [one-to-one, one-to-many, many-to-one]
            join: string
            conflicts:
              arrayOf: string
            # alias -> table name. S25/S26/S27 cover the semantic rules.
            aliases:
              object:
                additionalProperties: string

    glossary:
      object:
        additionalProperties: string

    # The dictionary's own version. S17 enforces exactly one key +
    # ISO-8601 valid dates
    version:
      object:
        closed: true
        properties:
          number:
            anyOf:
              - string
              - number
          date: string
          hash: string
