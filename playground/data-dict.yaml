$version: "0.1.0"
$learn_more: https://data-dict.tidyverse.org/
description: >
  A tiny wholesale bakery: customers and the orders they place. Synthetic
  data generated by generate.R for exercising render-report.
origin: generate.R
tables:
  - name: customers
    source:
      parquet: customers.parquet
    columns:
      - name: customer_id
        type: number(id)
        constraints: [primary_key]
        examples: [1, 57, 113, 168, 200]
      - name: name
        type: string
        constraints: [required]
        examples: [Alma's Bakery, Corner Cafe, Hotel Miramar]
      - name: email
        type: string
        constraints: [unique]
        examples: [alma@example.com, orders@cornercafe.example]
      - name: segment
        type: enum
        values: [retail, wholesale, internal]
      - name: signup_date
        type: date
        range: ["2023-01-01", "2024-12-31"]
      - name: postcode
        type: string
        examples: ["48042", "91355", "20671"]
        constraints:
          - assert: LENGTH(postcode) <= 10
            description: Postcodes are at most 10 characters.
  - name: orders
    source:
      parquet: orders.parquet
    columns:
      - name: order_id
        type: number(id)
        constraints: [primary_key]
        examples: [1, 500, 1000, 1500, 2000]
      - name: customer_id
        type: number(id)
        constraints: [foreign_key, required]
        examples: [3, 42, 101, 157, 199]
      - name: order_date
        type: date
        constraints: [required]
        range: ["2024-01-01", "2025-06-30"]
      - name: ship_date
        type: date
        range: ["2024-01-02", "2025-07-07"]
      - name: status
        type: enum
        values: [pending, shipped, delivered, cancelled]
      - name: quantity
        type: number(quantity)
        range: [1, 100]
        constraints:
          - assert: quantity >= 1
            description: An order is for at least one item.
      - name: unit_price
        type: number(quantity)
        units: USD
        range: [0.5, 500]
    definitions:
      - name: line_total
        description: Total value of the order line.
        expr: quantity * unit_price
    constraints:
      - assert: ship_date IS NULL OR ship_date >= order_date
        description: An order can't ship before it's placed.
      - assert: NOT(status = 'delivered') OR ship_date IS NOT NULL
        description: A delivered order must have a ship date.
      - assert: line_total <= 10000
        description: No single order exceeds the bakery's 10,000 USD credit limit.
relationships:
  - join: orders.customer_id = customers.customer_id
    cardinality: many-to-one
