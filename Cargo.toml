[workspace]
resolver = "2"
members = [
    "crates/data-dict",
    "crates/data-dict-cli",
    "crates/data-dict-lsp",
    "crates/data-dict-parquet",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/hadley/data-dict.yaml"

[workspace.dependencies]
data-dict = { path = "crates/data-dict", version = "0.0.1" }
data-dict-lsp = { path = "crates/data-dict-lsp", version = "0.0.1" }
clap = { version = "4", features = ["derive"] }
quarto-yaml = "0.1.0"
quarto-yaml-validation = "0.1.0"
quarto-source-map = "0.1.0"
annotate-snippets = "0.12"
parquet = { version = "54", default-features = false }
arrow-array = "54"
arrow-buffer = "54"
arrow-cast = "54"
arrow-row = "54"
arrow-schema = "54"
half = "2"
data-dict-parquet = { path = "crates/data-dict-parquet", version = "0.0.1" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
