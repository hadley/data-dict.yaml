[workspace]
resolver = "2"
members = [
    "crates/data-dict",
    "crates/data-dict-cli",
    "crates/data-dict-lsp",
    "crates/data-dict-parquet",
]

[workspace.package]
version = "0.0.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/tidyverse/data-dict"

[workspace.dependencies]
data-dict = { path = "crates/data-dict", version = "0.0.3" }
data-dict-lsp = { path = "crates/data-dict-lsp", version = "0.0.3" }
clap = { version = "4", features = ["derive"] }
quarto-yaml = { git = "https://github.com/posit-dev/quarto-yaml" }
quarto-yaml-validation = { git = "https://github.com/posit-dev/quarto-yaml" }
quarto-source-map = "0.1.0"
annotate-snippets = "0.12"
parquet = { version = "54", default-features = false }
arrow-array = "54"
arrow-buffer = "54"
arrow-cast = "54"
arrow-row = "54"
arrow-schema = "54"
half = "2"
data-dict-parquet = { path = "crates/data-dict-parquet", version = "0.0.3" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mimalloc = { version = "0.1", default-features = false }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
